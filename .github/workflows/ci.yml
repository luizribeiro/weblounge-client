---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # v6
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      # v35
      # yamllint disable-line rule:line-length
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c
      # v7
      # yamllint disable-line rule:line-length
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: >-
            nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock',
            'pnpm-lock.yaml', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - name: Check flake
        run: nix flake check --print-build-logs
