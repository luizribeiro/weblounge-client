---
name: CI

"on":
  # Every branch, so a branch is green before main is fast-forwarded to it.
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.list.outputs.checks }}
    steps:
      # v6
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/nix
      - id: list
        run: |
          nix run --inputs-from . nixpkgs#nix-eval-jobs -- \
            --flake .#checks.x86_64-linux --check-cache-status \
            --workers 2 --max-memory-size 3072 > jobs.jsonl
          test -s jobs.jsonl
          jq -cs 'map(select(.isCached | not) | .attr)' jobs.jsonl \
            | sed 's/^/checks=/' >> "$GITHUB_OUTPUT"

  deps:
    needs: list
    if: >-
      ${{ !cancelled() && needs.list.result == 'success'
      && needs.list.outputs.checks != '[]' }}
    runs-on: ubuntu-latest
    steps:
      # v6
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/nix
        with:
          auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build shared dependencies
        run: |
          paths=$(nix build --print-build-logs --no-link --print-out-paths \
            .#packages.x86_64-linux.ci-deps)
          echo "$paths" | cachix push weblounge || true

  outputs:
    needs: [list, deps]
    if: ${{ !cancelled() && needs.list.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # v6
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/nix
        with:
          auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Evaluate packages and formatter
        run: |
          nix eval --json .#packages.x86_64-linux \
            --apply 'builtins.mapAttrs (_: package: package.drvPath)'
          nix eval .#formatter.x86_64-linux.drvPath
      - name: Build the development shell
        run: |
          paths=$(nix build --print-build-logs --no-link --print-out-paths \
            .#devShells.x86_64-linux.default)
          echo "$paths" | cachix push weblounge || true

  build:
    needs: [list, deps]
    if: >-
      ${{ !cancelled() && needs.list.result == 'success'
      && needs.list.outputs.checks != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.list.outputs.checks) }}
    name: ${{ matrix.check }}
    steps:
      # v6
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/nix
        with:
          auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - env:
          CHECK: ${{ matrix.check }}
        run: |
          paths=$(nix build --print-build-logs --no-link --print-out-paths \
            ".#checks.x86_64-linux.$CHECK")
          echo "$paths" | cachix push weblounge || true

  ci:
    needs: [list, deps, outputs, build]
    if: always()
    runs-on: ubuntu-latest
    name: CI
    steps:
      - env:
          RESULTS: >-
            ${{ needs.list.result }}
            ${{ needs.list.outputs.checks == '[]' && 'success'
            || needs.deps.result }}
            ${{ needs.outputs.result }}
            ${{ needs.list.outputs.checks == '[]' && 'success'
            || needs.build.result }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            test "$result" = success || exit 1
          done
