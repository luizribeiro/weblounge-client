[workspace]
resolver = "3"
members = ["crates/command-derive", "crates/engine", "crates/engine-wasm"]

[workspace.package]
edition = "2024"
rust-version = "1.91"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/luizribeiro/weblounge-client"

[workspace.dependencies]
papo = { git = "https://github.com/luizribeiro/papo", rev = "7d5e4bf2da42f1863753e1311ee817db9e08aa2f", features = ["precis"] }
papo-testing = { git = "https://github.com/luizribeiro/papo", rev = "7d5e4bf2da42f1863753e1311ee817db9e08aa2f" }
js-sys = "0.3.79"
proc-macro2 = "1.0.103"
quote = "1.0.42"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
syn = { version = "2.0.111", features = ["full"] }
tokio = { version = "1.53.3", features = ["macros", "rt", "sync", "time"] }
ts-rs = "11.1.0"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
