name: weblounge-desktop
options:
  bundleIdPrefix: org.weblounge.ios.dev
  deploymentTarget:
    iOS: 17.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: weblounge dev
      PRODUCT_BUNDLE_IDENTIFIER: org.weblounge.ios.dev
      DEVELOPMENT_TEAM: JR4C2QJKWJ
  push-payload:
    base:
      WEBLOUNGE_REPO: $(SRCROOT)/../../../..
      WEBLOUNGE_RUST_TARGET[sdk=iphoneos*]: aarch64-apple-ios
      WEBLOUNGE_RUST_TARGET[sdk=iphonesimulator*]: aarch64-apple-ios-sim
      SWIFT_OBJC_BRIDGING_HEADER: NotificationService/PushPayload.h
      HEADER_SEARCH_PATHS: $(inherited) "$(WEBLOUNGE_REPO)/crates/push-payload/include"
      LIBRARY_SEARCH_PATHS: $(inherited) "$(WEBLOUNGE_REPO)/target/$(WEBLOUNGE_RUST_TARGET)/release"
      OTHER_LDFLAGS: -lweblounge_push_payload
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  weblounge-desktop_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # Exclude built static libs: regenerating with xcodegen after a build
      # otherwise turns the per-configuration libapp.a copies into colliding
      # resources ("Multiple commands produce …/libapp.a"). They are linked
      # via LIBRARY_SEARCH_PATHS, never bundled as resources.
      - path: Externals
        excludes: ["**/*.a"]
      - path: weblounge-desktop_iOS
      # `assets` is not a resource: Tauri fills it only from `bundle.resources`, which the app has
      # none of, and App Store Connect rejects an empty folder in the bundle (90207).
      - path: LaunchScreen.storyboard
    info:
      path: weblounge-desktop_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        WebloungeAppGroup: group.$(PRODUCT_BUNDLE_IDENTIFIER)
        WebloungeKeychainGroup: $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: 0.1.3
        CFBundleVersion: "0.1.3"
    entitlements:
      path: weblounge-desktop_iOS/weblounge-desktop_iOS.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups:
          - group.$(PRODUCT_BUNDLE_IDENTIFIER)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: $(PRODUCT_BUNDLE_IDENTIFIER)
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - target: weblounge-notifications
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: |
          cargo tauri ios xcode-script -v --platform "${PLATFORM_DISPLAY_NAME:?}" --sdk-root "${SDKROOT:?}" --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration "${CONFIGURATION:?}" ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
  weblounge-notifications:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
      - path: &sharedStorage ../../ios-shell/ios/Sources/Shared/SharedStorage.swift
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleShortVersionString: 0.1.3
        CFBundleVersion: "0.1.3"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
        WebloungeAppGroup: group.$(WEBLOUNGE_APP_IDENTIFIER)
        WebloungeKeychainGroup: $(AppIdentifierPrefix)$(WEBLOUNGE_APP_IDENTIFIER)
    entitlements:
      path: NotificationService/NotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(WEBLOUNGE_APP_IDENTIFIER)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(WEBLOUNGE_APP_IDENTIFIER)
    settings:
      base:
        # Tauri's release `--config` rewrites only the app target and forwards only TAURI_*
        # variables to Xcode, so release builds also set TAURI_WEBLOUNGE_APP_IDENTIFIER.
        WEBLOUNGE_APP_IDENTIFIER: $(TAURI_WEBLOUNGE_APP_IDENTIFIER:default=org.weblounge.ios.dev)
        PRODUCT_BUNDLE_IDENTIFIER: $(WEBLOUNGE_APP_IDENTIFIER).notifications
        PRODUCT_NAME: weblounge-notifications
        DEVELOPMENT_TEAM: JR4C2QJKWJ
        TARGETED_DEVICE_FAMILY: 1
        ARCHS: [arm64]
        SKIP_INSTALL: true
      groups: [push-payload]
    preBuildScripts:
      # Cargo tracks its own inputs, so Xcode runs this every build and cargo skips clean work.
      # Always the size-optimised release profile: the extension has about 24 MB of memory.
      - name: Build push-payload
        basedOnDependencyAnalysis: false
        script: |
          command -v cargo >/dev/null || { echo "error: cargo is not on PATH; build from nix develop" >&2; exit 1; }
          cargo rustc --manifest-path "${WEBLOUNGE_REPO:?}/Cargo.toml" --target-dir "${WEBLOUNGE_REPO:?}/target" \
            -p weblounge-push-payload --lib --crate-type staticlib --release --target "${WEBLOUNGE_RUST_TARGET:?}"
        outputFiles:
          - $(WEBLOUNGE_REPO)/target/$(WEBLOUNGE_RUST_TARGET)/release/libweblounge_push_payload.a
  # Runs in the dev app, which `cargo tauri ios build --debug` must have built, so the extension's
  # code gets the app's keychain and App Group entitlements; Tauri's Rust step only runs under the
  # Tauri CLI, so the app can't be built from this scheme.
  weblounge-notifications-tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NotificationService
        includes: ["*.swift"]
      - path: *sharedStorage
      - path: NotificationServiceTests
    dependencies:
      - target: weblounge-notifications
        embed: false
    settings:
      groups: [push-payload]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.weblounge.ios.dev.notifications-tests
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: ""
        ARCHS: [arm64]
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/weblounge dev.app/weblounge dev
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  weblounge-notifications-tests:
    build:
      targets:
        weblounge-notifications-tests: [test]
    test:
      targets: [weblounge-notifications-tests]
      # The host app forwards its stderr to the unified log, which echoes to stderr under test.
      environmentVariables:
        OS_ACTIVITY_DT_MODE: "NO"
