[package]
name = "weblounge-ios-shell"
description = "The Swift half of the iOS shell, loaded as a Tauri mobile plugin"
version = "0.1.3"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/luizribeiro/weblounge-client"
publish = false
links = "weblounge-ios-shell"

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
